# Build CGO-backed binaries for every platform the install script expects, attach
# SHA256SUMS, and cut a GitHub Release. Trigger: push tag v* (e.g. v0.1.0).
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: "1.24.x"
  # Expanded once here so run: blocks reference $REF_NAME / $REPO as shell vars
  # rather than letting Actions splice a tag name straight into the script.
  REF_NAME: ${{ github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  darwin:
    name: macOS (amd64 + arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${REF_NAME}" -o looptap-darwin-amd64 .
      - name: arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${REF_NAME}" -o looptap-darwin-arm64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-darwin-amd64
          path: looptap-darwin-amd64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-darwin-arm64
          path: looptap-darwin-arm64

  linux-glibc-amd64:
    name: Linux glibc amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: CGO_ENABLED=1 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${REF_NAME}" -o looptap-linux-amd64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-amd64
          path: looptap-linux-amd64

  linux-glibc-arm64:
    name: Linux glibc arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: CGO_ENABLED=1 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${REF_NAME}" -o looptap-linux-arm64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-arm64
          path: looptap-linux-arm64

  linux-musl-amd64:
    name: Linux musl amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: |
          docker run --rm -e REF_NAME -v "${PWD}:/src" -w /src golang:1.24-alpine sh -ec '
            apk add --no-cache build-base sqlite-dev git
            CGO_ENABLED=1 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${REF_NAME}" -o looptap-linux-amd64-musl .
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-amd64-musl
          path: looptap-linux-amd64-musl

  linux-musl-arm64:
    name: Linux musl arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: |
          docker run --rm -e REF_NAME -v "${PWD}:/src" -w /src golang:1.24-alpine sh -ec '
            apk add --no-cache build-base sqlite-dev git
            CGO_ENABLED=1 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${REF_NAME}" -o looptap-linux-arm64-musl .
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux-arm64-musl
          path: looptap-linux-arm64-musl

  publish:
    name: GitHub Release + SHA256SUMS
    needs:
      - darwin
      - linux-glibc-amd64
      - linux-glibc-arm64
      - linux-musl-amd64
      - linux-musl-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Flatten & checksum
        run: |
          mkdir -p release
          find artifacts -type f -name 'looptap-*' -exec cp {} release/ \;
          cd release
          sha256sum looptap-* | sort -k2 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$REF_NAME" \
            --repo "$REPO" \
            --title "$REF_NAME" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${REPO}/main/scripts/install.sh | bash\`" \
            release/*
