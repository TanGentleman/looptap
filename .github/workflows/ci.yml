# Build from source, run tests, lint the automation, and smoke the binary on every push and PR.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24.x"

jobs:
  lint-automation:
    name: Lint workflows & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: shfmt
        run: shfmt -d scripts/*.sh

      - name: ci-guardrails
        run: ./scripts/ci-guardrails.sh

  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Vet
        run: go vet ./...

      - name: Test (race detector on)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o looptap .

      - name: "Smoke: binary boots and SQLite migration runs"
        run: ./scripts/smoke-db.sh ./looptap /tmp/ci-smoke.db
