# Download the just-published release binaries and make sure they actually run.
# Also exercises install.sh end-to-end.
name: Release smoke

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  binary:
    name: Binary (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: looptap-linux-amd64
            smoke: native
          - runner: ubuntu-24.04-arm
            asset: looptap-linux-arm64
            smoke: native
          - runner: macos-14
            asset: looptap-darwin-arm64
            smoke: native
          - runner: ubuntu-latest
            asset: looptap-linux-amd64-musl
            smoke: musl
          - runner: ubuntu-24.04-arm
            asset: looptap-linux-arm64-musl
            smoke: musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false # for scripts/smoke-db.sh

      - name: Download release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "$ASSET" --dir .
          chmod +x "$ASSET"
          mv "$ASSET" looptap

      - name: "Smoke: binary boots and SQLite works"
        if: matrix.smoke == 'native'
        run: bash scripts/smoke-db.sh ./looptap /tmp/smoke.db

      - name: "Smoke: musl binary boots and SQLite works"
        if: matrix.smoke == 'musl'
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 \
            sh -ec 'apk add --no-cache bash && bash scripts/smoke-db.sh ./looptap /tmp/smoke.db'

  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false # for scripts/

      - name: Install via install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/install.sh "$RELEASE_TAG"

      - name: "Smoke: installed binary boots"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/smoke-db.sh "$(command -v looptap)" /tmp/smoke.db
